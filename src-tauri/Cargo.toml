[package]
name = "troponin-tdms-app"
version = "0.1.0"
description = "Native top-down mass spectrometry analysis (v0 scaffold)"
authors = ["Troponin TDMS"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "troponin-tdms-app"
path = "src/main.rs"

# crate-type list comes from the Tauri 2 mobile template; keeping it commented
# out for the v0 desktop-only build keeps Cargo.toml minimal.
# [lib]
# name = "troponin_tdms_app_lib"
# crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri          = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tokio          = { version = "1", features = ["full"] }
uuid           = { version = "1", features = ["v4"] }
once_cell      = "1"

[features]
# This feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
